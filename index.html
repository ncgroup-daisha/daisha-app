<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1677f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NCGroup 代車管理">
  <title>NCGroup 代車管理</title>
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: #f3f6fa;
      color: #172033;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      text-align: center;
    }
    main {
      width: min(100%, 460px);
      padding: 34px 24px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 36px rgba(26, 54, 93, .12);
    }
    img { width: 120px; height: 120px; border-radius: 25px; }
    h1 { margin: 20px 0 8px; font-size: 28px; }
    p { margin: 8px 0 24px; color: #5b6575; line-height: 1.7; }
    a {
      display: block;
      padding: 16px 20px;
      border-radius: 14px;
      background: #1769d2;
      color: white;
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
    }
    small { display: block; margin-top: 20px; color: #6c7686; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="NCGroup 代車管理">
    <h1>NCGroup 代車管理</h1>
    <p>貸出・返却・予約をスマホで簡単に管理できます。</p>
    <a href="https://script.google.com/macros/s/AKfycbzCPT13mAMnWeY_LOsYwXVU8QsCusVjevbTEQrmcG7vSxFfxraP2i_eQIcUD-UVAc605Q/exec?v=20260919">代車管理を開く</a>
    <small>iPhoneでは共有ボタンから「ホーム画面に追加」を選んでください。</small>
  </main>
  <script>
    const appUrl = "https://script.google.com/macros/s/AKfycbzCPT13mAMnWeY_LOsYwXVU8QsCusVjevbTEQrmcG7vSxFfxraP2i_eQIcUD-UVAc605Q/exec?v=20260919";
    const installed = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
    if (installed) window.location.replace(appUrl);
  </script>
</body>
</html>
