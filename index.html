<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1677f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NCGroup 代車管理">
  <title>NCGroup 代車管理</title>
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=20261008">
  <link rel="icon" type="image/png" href="icon.png?v=20261008">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: #f3f6fa;
      color: #172033;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      text-align: center;
    }
    main {
      width: min(100%, 460px);
      padding: 34px 24px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 36px rgba(26, 54, 93, .12);
    }
    img { width: 120px; height: 120px; border-radius: 25px; }
    h1 { margin: 20px 0 8px; font-size: 28px; }
    p { margin: 8px 0 24px; color: #5b6575; line-height: 1.7; }
    a {
      display: block;
      padding: 16px 20px;
      border-radius: 14px;
      background: #1769d2;
      color: white;
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
    }
    small { display: block; margin-top: 20px; color: #6c7686; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="NCGroup 代車管理">
    <h1>NCGroup 代車管理</h1>
    <p>貸出・返却・予約をスマホで簡単に管理できます。</p>
    <a id="openApp" href="https://script.google.com/macros/s/AKfycbzCPT13mAMnWeY_LOsYwXVU8QsCusVjevbTEQrmcG7vSxFfxraP2i_eQIcUD-UVAc605Q/exec?v=20261008">代車管理を開く</a>
    <small>iPhoneでは共有ボタンから「ホーム画面に追加」を選んでください。</small>
  </main>
  <script>
const appUrl = 'https://script.google.com/macros/s/AKfycbzCPT13mAMnWeY_LOsYwXVU8QsCusVjevbTEQrmcG7vSxFfxraP2i_eQIcUD-UVAc605Q/exec';
const tokenKey = 'ncgroup.daisha.browserToken.v1';
const authKey = 'ncgroup.daisha.intakeDevice.v1';
const vehicle = new URLSearchParams(window.location.search).get('vehicle') || '';
const validVehicle = /^[VR][0-9]{3}$/.test(vehicle);
const fragment = new URLSearchParams(window.location.hash.replace(/^#/,''));
const keys = [...fragment.keys()];
const supplied = fragment.get('ncgDevice') || '';
const authSupplied = fragment.get('ncgIntake') || '';
const clearAuth = fragment.get('clearIntake') === '1';
const validFragment = keys.every(k=>['ncgDevice','ncgIntake','clearIntake'].includes(k)) && new Set(keys).size===keys.length && (!supplied || /^[a-f0-9]{64}$/.test(supplied)) && (!authSupplied || /^DEVICE-[a-f0-9-]{72}$/.test(authSupplied)) && (!fragment.has('clearIntake') || clearAuth);
let token='',auth='',savedAuth=false;
if(validFragment) {
  try {
    if(supplied)localStorage.setItem(tokenKey,supplied);
    const cached=supplied||localStorage.getItem(tokenKey)||'';if(/^[a-f0-9]{64}$/.test(cached))token=cached;
    if(clearAuth)localStorage.removeItem(authKey);
    else if(authSupplied){localStorage.setItem(authKey,authSupplied);savedAuth=localStorage.getItem(authKey)===authSupplied;}
    const cachedAuth=clearAuth?'':authSupplied||localStorage.getItem(authKey)||'';if(/^DEVICE-[a-f0-9-]{72}$/.test(cachedAuth))auth=cachedAuth;
  } catch (_) {token=supplied;auth=clearAuth?'':authSupplied;}
}
const entryHash=(token?'ncgDevice='+token:'')+(auth?(token?'&':'')+'ncgIntake='+auth:'');
if(entryHash)window.history.replaceState(null,'',window.location.pathname+window.location.search+'#'+entryHash);
else if(clearAuth)window.history.replaceState(null,'',window.location.pathname+window.location.search);
const destination=appUrl+'?v=20261008-auth'+(validVehicle?'&vehicle='+encodeURIComponent(vehicle):'')+(entryHash?'#'+entryHash:'');
document.getElementById('openApp').href=destination;
if(authSupplied&&!clearAuth) {
  const message=document.querySelector('main p');message.textContent=savedAuth?'このブラウザーに受付利用の登録を保存しました。「代車管理を開く」からご利用ください。':'保存を確認できません。SafariやChromeの通常モードでこのリンクを開き直してください。';
  document.querySelector('small').textContent='この入口は端末専用です。他の人へ送らず、このページでブックマーク／ホーム画面へ追加してください。';
}
const installed=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;
if((installed||validVehicle)&&!authSupplied) {
  document.querySelector('main').innerHTML='<img src="icon.png?v=20261008" alt="NCGroup"><p role="status">読み込み中…</p>';
  requestAnimationFrame(()=>requestAnimationFrame(()=>window.location.replace(destination)));
}
</script>
</body>
</html>
